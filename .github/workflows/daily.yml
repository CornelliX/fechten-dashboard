name: Täglich aktualisieren

on:
  schedule:
    # Nicht zur vollen Stunde: GitHub verwirft geplante Läufe bei hoher Last (am 16.11.2026 um 05:00 UTC passiert).
    # Zweiter Lauf als Absicherung. Keine Mail: Neuigkeiten stehen nur im Dashboard unter „Letzte News“.
    - cron: "23 4 * * *"       # 5:23 Uhr MEZ / 6:23 Uhr MESZ
    - cron: "41 15 * * *"      # 16:41 Uhr MEZ / 17:41 Uhr MESZ
  workflow_dispatch:            # manuell starten: Actions → "Täglich aktualisieren" → Run workflow
  push:
    paths: [manual.json]        # Ophardt-Daten von Hand geändert → sofort übernehmen

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # immer neuesten Stand, nicht den zum Startzeitpunkt (Läufe sind per concurrency serialisiert)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_update.py
      - id: u
        run: python update.py
      - name: Daten speichern
        run: |
          set -euo pipefail
          git config user.name "fecht-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Daten $(date -u +%F)"
          # Falls doch jemand dazwischen gepusht hat: rebasen; bei Konflikt abbrechen statt überschreiben
          git pull --rebase || { git rebase --abort; exit 1; }
          git push
